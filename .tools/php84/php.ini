; Project-local php.ini for the WinGet PHP 8.4 CLI (Moodle 5.2 upgrade + smoke).
; Used via:  php.exe -c "D:\Claude Local\airpay-ld-os\.tools\php84\php.ini"
; The WinGet package itself stays pristine (no ini dropped into it).

extension_dir = "C:\Users\nitin.rajput\AppData\Local\Microsoft\WinGet\Packages\PHP.PHP.8.4_Microsoft.Winget.Source_8wekyb3d8bbwe\ext"

; ── Moodle-required / recommended extensions ──
extension=curl
extension=exif
extension=fileinfo
extension=gd
extension=intl
extension=mbstring
extension=mysqli
extension=openssl
extension=soap
extension=sodium
extension=zip
zend_extension=opcache

; ── CLI runtime ──
max_input_vars = 5000
memory_limit = 2G
max_execution_time = 0
error_reporting = E_ALL & ~E_DEPRECATED
display_errors = On
date.timezone = Asia/Kolkata
opcache.enable_cli = 1

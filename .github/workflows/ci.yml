name: CI — Airpay Academy

# Runs on every PR + every push to production branch.
#
# Gates (all block merge on failure):
#   1. php-lint              — PHP syntax check on every airpay file
#   2. static-checks         — JSON validity + Mustache balance
#   3. ws-contract-gate      — ADR-009 contract drift gate (standalone
#                              static analysis; no Moodle bootstrap)
#   4. conflict-marker-check — fail-fast scan for stray git conflict
#                              markers in source files (P0 cleanup A,
#                              backstop for the local pre-commit hook
#                              when someone bypasses --no-verify)
#   5. version-bump-check    — warns when plugin code changed without
#                              a version.php bump (PR-only, non-blocking)
#   6. playwright-linux      — Linux E2E + visual smoke against a
#                              containerised Moodle 5.x + airpayux
#                              theme. Advisory gate (continue-on-error)
#                              during P2 cutover-prep — transitions to
#                              blocking once visual baselines are
#                              calibrated. See docs/ci/PLAYWRIGHT-GATE.md.
#
# Full Moodle PHPUnit is NOT included here — it requires spinning
# up Moodle 5.1.3+ with our 30+ plugins on a fresh runner (~5-15 min
# init per PR). Local invocation:
#   cd C:\xampp\htdocs\moodle5
#   php public/admin/tool/phpunit/cli/init.php
#   vendor/bin/phpunit.bat --group ws_contract,role_detector \
#     public/theme/airpayux/tests/
# See theme/airpayux/tests/README.md for the full PHPUnit runbook.

on:
  pull_request:
    paths:
      - 'moodle-enhancement/**'
      - 'local/airpay_**'
      - 'theme/airpayux/**'
      - 'tests/playwright/**'
      - '.github/workflows/**'
  push:
    branches:
      - production
    paths:
      - 'moodle-enhancement/**'
      - 'local/airpay_**'
      - 'theme/airpayux/**'
      - 'tests/playwright/**'
      - '.github/workflows/**'

jobs:
  php-lint:
    name: PHP syntax check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: none

      - name: Lint all airpay PHP files
        run: |
          set -e
          # Find every PHP file under moodle-enhancement/, local/airpay_*/, theme/airpayux/.
          # `php -l` checks syntax without running.
          find moodle-enhancement -name '*.php' \
               -not -path '*/node_modules/*' \
               -not -path '*/vendor/*' \
            -print0 \
            | xargs -0 -n 1 php -l > /tmp/lint.log 2>&1 || true

          # Also lint root-level airpay plugins if any
          if [ -d local ]; then
            find local -maxdepth 2 -name 'airpay_*' -type d -exec \
              find {} -name '*.php' \; \
              | xargs -n 1 php -l >> /tmp/lint.log 2>&1 || true
          fi

          # Theme files
          if [ -d theme/airpayux ]; then
            find theme/airpayux -name '*.php' \
              | xargs -n 1 php -l >> /tmp/lint.log 2>&1 || true
          fi

          # Surface failures
          if grep -E "Parse error|Errors parsing" /tmp/lint.log; then
            echo
            echo "::error::PHP lint failures detected"
            exit 1
          fi
          PASS=$(grep -c "No syntax errors detected" /tmp/lint.log || true)
          echo "::notice::PHP lint passed: $PASS files"

  static-checks:
    name: Mustache + JSON syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JSON files
        run: |
          set -e
          FAILS=0
          while IFS= read -r f; do
            if ! python3 -m json.tool "$f" > /dev/null 2>&1; then
              echo "::error file=$f::Invalid JSON"
              FAILS=$((FAILS + 1))
            fi
          done < <(find moodle-enhancement local/airpay_* theme/airpayux \
                     -name '*.json' \
                     -not -path '*/node_modules/*' \
                     -not -name '*.min.json.map' \
                     2>/dev/null || true)
          if [ $FAILS -gt 0 ]; then
            echo "::error::$FAILS invalid JSON files"
            exit 1
          fi

      - name: Mustache balance check
        run: |
          set -e
          # Quick sanity: every Mustache open tag must have a matching close.
          # Moodle's Mustache supports four open forms, all closed by {{/name}}:
          #   {{#section}}   — regular section (truthy)
          #   {{^section}}   — inverted section (falsy)
          #   {{$param}}     — block parameter (Moodle template inheritance)
          #   {{<partial}}   — parent template inheritance (Moodle extension)
          # Skips {{!comment}} and {{>partial}} (one-off, no close).
          #
          # Limits:
          # - Count-only check; doesn't verify nesting order or that close-tag
          #   NAMES match open-tag names (Mustache itself catches that at compile time).
          # - Doesn't handle multi-line Mustache delimiters (rare; we don't use them).
          FAILS=0
          while IFS= read -r f; do
            REGULAR=$(grep -oE '\{\{#[^}]+\}\}' "$f" 2>/dev/null | wc -l)
            INVERTED=$(grep -oE '\{\{\^[^}]+\}\}' "$f" 2>/dev/null | wc -l)
            BLOCK=$(grep -oE '\{\{\$[^}]+\}\}' "$f" 2>/dev/null | wc -l)
            PARENT=$(grep -oE '\{\{<[^}]+\}\}' "$f" 2>/dev/null | wc -l)
            CLOSES=$(grep -oE '\{\{/[^}]+\}\}' "$f" 2>/dev/null | wc -l)
            OPENS=$((REGULAR + INVERTED + BLOCK + PARENT))
            if [ "$OPENS" != "$CLOSES" ]; then
              echo "::error file=$f::Unbalanced Mustache tags ($OPENS opens vs $CLOSES closes; #=$REGULAR ^=$INVERTED \$=$BLOCK <=$PARENT)"
              FAILS=$((FAILS + 1))
            fi
          done < <(find moodle-enhancement local/airpay_* theme/airpayux \
                     -name '*.mustache' 2>/dev/null || true)
          if [ $FAILS -gt 0 ]; then exit 1; fi
          echo "::notice::Mustache balance check passed"

  ws-contract-gate:
    name: WS contract drift (ADR-009)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: none

      - name: Lint the standalone gate script
        run: |
          php -l moodle-enhancement/tools/ci-ws-contract-check.php

      - name: Run ws_contract gate (standalone static analysis)
        run: |
          # Walks every airpay_* plugin mustache for data-region=
          # "airpay-datatable" + data-ws-name="X" pairs, resolves each
          # WS to its class file via db/services.php, and verifies the
          # class declares all 6 contract keys (search, sort, sortdir,
          # page, perpage, filters) in execute_parameters().
          #
          # Exit codes (block merge on 1 or 2):
          #   0  All contracts satisfied
          #   1  One or more failures (specific keys missing)
          #   2  Zero consumers found (scanner regex broken / config)
          #
          # See ADR-009 + theme/airpayux/tests/ws_contract_test.php for
          # the Moodle-aware version that runs locally with PHPUnit.
          # This standalone variant runs without Moodle bootstrap so
          # CI doesn't need to install Moodle on every PR (which would
          # cost ~5-15 min per run).
          php moodle-enhancement/tools/ci-ws-contract-check.php

  conflict-marker-check:
    name: Stray git conflict markers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan source tree for conflict markers
        run: |
          # Backstop for .claude/hooks/pre-commit.sh CHECK 11. Local
          # hook catches markers at commit; this CI gate catches them
          # if someone bypassed the hook with --no-verify, committed
          # via a tool that doesn't run hooks, or pushed a force-update.
          #
          # CI runs #397 + #403 on 2026-05-24 failed because mid-merge
          # commits carried stray <<<<<<<, =======, >>>>>>> markers in
          # PHP and lang files — invalid PHP, only detected once the
          # delayed CI notification fired. This gate is ~5 seconds and
          # eliminates the surprise.
          #
          # Regex matches git's exact conflict-marker format:
          #   ^<<<<<<<( |$)  '<<<<<<< HEAD' or bare '<<<<<<<'
          #   ^=======$      bare '=======' alone (never '========'
          #                  setext banners or 32-wide CLI heredoc
          #                  dividers like ws_contract_audit.php:80)
          #   ^>>>>>>>( |$)  '>>>>>>> branch-name' or bare '>>>>>>>'
          # Skips legit {{<partial}} Mustache inheritance + SCSS/MD
          # `// =====` comment dividers + setext heredoc help text.
          set +e
          MARKERS=$(grep -rnE '^<<<<<<<( |$)|^=======$|^>>>>>>>( |$)' \
            --include='*.php' \
            --include='*.mustache' \
            --include='*.scss' \
            --include='*.js' \
            --include='*.json' \
            --include='*.xml' \
            --include='*.md' \
            --include='*.yml' \
            moodle-enhancement/ \
            theme/airpayux/ \
            local/ \
            .github/ \
            .claude/ 2>/dev/null)
          if [ -n "$MARKERS" ]; then
            echo "::error::Stray git conflict markers detected:"
            echo "$MARKERS" | while IFS= read -r line; do
              FILE=$(echo "$line" | cut -d: -f1)
              LINENO=$(echo "$line" | cut -d: -f2)
              CONTENT=$(echo "$line" | cut -d: -f3-)
              echo "::error file=$FILE,line=$LINENO::Conflict marker: $CONTENT"
            done
            exit 1
          fi
          echo "::notice::No conflict markers found"

  version-bump-check:
    name: version.php bump on plugin changes
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify version.php bumped when plugin code changed
        run: |
          set -e
          BASE=${{ github.event.pull_request.base.sha }}
          HEAD=${{ github.event.pull_request.head.sha }}

          # For every airpay plugin that has any change, version.php must also have changed.
          CHANGED_DIRS=$(git diff --name-only "$BASE" "$HEAD" \
            | grep -oE '(moodle-enhancement/local/airpay_[a-z_]+|local/airpay_[a-z_]+)' \
            | sort -u || true)

          MISSING=0
          for dir in $CHANGED_DIRS; do
            if ! git diff --name-only "$BASE" "$HEAD" | grep -q "^$dir/version.php"; then
              # Only complain if files OTHER than tests/ changed
              if git diff --name-only "$BASE" "$HEAD" | grep "^$dir/" | grep -v '/tests/' | grep -q .; then
                echo "::warning file=$dir/version.php::Plugin code changed but version.php was not bumped"
                MISSING=$((MISSING + 1))
              fi
            fi
          done

          if [ $MISSING -gt 0 ]; then
            echo "$MISSING plugin(s) need version.php bump."
            # Don't fail the PR — this is a warning, not an error.
          fi

  playwright-linux:
    name: Playwright E2E + visual (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # ADVISORY GATE during P2 cutover-prep. Failures do NOT block merge
    # while visual baselines are being calibrated. Flip this to false
    # (i.e. delete the line) once docs/ci/PLAYWRIGHT-GATE.md §4 (blocking
    # graduation checklist) is signed off.
    continue-on-error: true

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: moodle
          MYSQL_USER: moodleuser
          MYSQL_PASSWORD: moodlepass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -prootpass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repo (Moodle source root)
        uses: actions/checkout@v4
        with:
          path: moodle

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: moodle/tests/playwright/package-lock.json

      - name: Provision moodledata + config
        working-directory: moodle
        run: |
          set -e
          mkdir -p "${{ github.workspace }}/moodledata"
          chmod 0777 "${{ github.workspace }}/moodledata"
          cat > config.php <<'PHP'
          <?php
          unset($CFG);
          global $CFG;
          $CFG = new stdClass();
          $CFG->dbtype    = 'mariadb';
          $CFG->dblibrary = 'native';
          $CFG->dbhost    = '127.0.0.1';
          $CFG->dbname    = 'moodle';
          $CFG->dbuser    = 'root';
          $CFG->dbpass    = 'rootpass';
          $CFG->prefix    = 'mdl_';
          $CFG->dboptions = array(
              'dbpersist' => 0,
              'dbsocket'  => '',
              'dbport'    => '3306',
              'dbcollation' => 'utf8mb4_unicode_ci',
          );
          $CFG->wwwroot   = 'http://localhost:8000';
          $CFG->dataroot  = getenv('GITHUB_WORKSPACE') . '/moodledata';
          $CFG->admin     = 'admin';
          $CFG->directorypermissions = 0777;
          require_once(__DIR__ . '/lib/setup.php');
          PHP

      - name: Start moodlehq/moodle-php-apache:8.2 container
        run: |
          set -e
          docker run -d --name moodle-web \
            --network=host \
            -v "${{ github.workspace }}/moodle:/var/www/html" \
            -v "${{ github.workspace }}/moodledata:/var/www/moodledata" \
            -e MOODLE_DOCKER_DB_TYPE=mariadb \
            -e MOODLE_DOCKER_DB_HOST=127.0.0.1 \
            -e MOODLE_DOCKER_DB_NAME=moodle \
            -e MOODLE_DOCKER_DB_USER=root \
            -e MOODLE_DOCKER_DB_PASS=rootpass \
            moodlehq/moodle-php-apache:8.2
          # Apache in this image listens on :80 — bind via --network=host so
          # tests at http://localhost:8000 reach it. Some image variants ship
          # Apache on :8000 directly; we cover both by mapping the listen.
          docker exec moodle-web sh -c \
            "sed -i 's/Listen 80$/Listen 8000/; s/<VirtualHost \*:80>/<VirtualHost *:8000>/' \
              /etc/apache2/ports.conf /etc/apache2/sites-enabled/*.conf 2>/dev/null || true"
          docker exec moodle-web sh -c "apache2ctl -k graceful 2>/dev/null || apache2ctl restart 2>/dev/null || true"

      - name: Wait for Moodle webserver
        run: |
          set -e
          for i in $(seq 1 30); do
            if curl -fsS -m 5 http://localhost:8000/ > /dev/null 2>&1; then
              echo "Moodle reachable after ${i} attempt(s)"
              exit 0
            fi
            sleep 5
          done
          echo "::warning::Moodle webserver did not respond in 150s — playwright will run against an unreachable target and surface failures."
          docker logs moodle-web --tail=200 || true

      - name: Install Moodle site (admin/cli/install_database.php)
        working-directory: moodle
        run: |
          set -e
          docker exec moodle-web sh -c "cd /var/www/html && php admin/cli/install_database.php \
            --agree-license \
            --fullname='Sentientia LMS CI' \
            --shortname='sentientia-ci' \
            --adminuser=admin \
            --adminpass='AdminPass!23' \
            --adminemail='ci@example.test' \
            --supportemail='ci@example.test' \
            --lang=en \
            --non-interactive" || echo "::warning::Moodle install_database.php exited non-zero — gate will surface as Playwright failures (advisory)."

      - name: Install Playwright dependencies
        working-directory: moodle/tests/playwright
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium firefox webkit

      - name: Run Playwright (chromium + firefox + webkit)
        working-directory: moodle/tests/playwright
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:8000
          PLAYWRIGHT_ADMIN_USER: admin
          PLAYWRIGHT_ADMIN_PASS: 'AdminPass!23'
          CI: 'true'
        run: |
          npx playwright test --reporter=list,html,junit

      - name: Capture moodle-web container logs (always)
        if: always()
        run: |
          docker logs moodle-web --tail=400 > moodle/tests/playwright/test-results/apache.log 2>&1 || true
          docker ps -a > moodle/tests/playwright/test-results/docker-ps.log 2>&1 || true

      - name: Upload Playwright report + traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            moodle/tests/playwright/test-results/**
            moodle/tests/playwright/playwright-report/**
          if-no-files-found: warn
          retention-days: 14

      - name: Tear down moodle-web container
        if: always()
        run: |
          docker logs moodle-web --tail=100 || true
          docker rm -f moodle-web || true

# ═══════════════════════════════════════════════════════════
# Apache Config — Airpay Academy (no /moodle/ in URLs)
# ═══════════════════════════════════════════════════════════
#
# Option A: Document root installation (RECOMMENDED)
#   Set DocumentRoot to the Moodle directory directly.
#   No rewrite rules needed. URLs become https://www.airpay.academy/
#
# Option B: Rewrite rules (if Moodle can't be at document root)
#   Keep Moodle in a subdirectory but rewrite URLs.
#
# After deploying, update Moodle config.php:
#   $CFG->wwwroot = 'https://www.airpay.academy';
#
# ═══════════════════════════════════════════════════════════

# ─── OPTION A: Document Root ────────────────────────────
<VirtualHost *:443>
    ServerName www.airpay.academy
    DocumentRoot /var/www/moodle

    SSLEngine on
    SSLCertificateFile    /etc/ssl/certs/airpay-academy.crt
    SSLCertificateKeyFile /etc/ssl/private/airpay-academy.key

    <Directory /var/www/moodle>
        AllowOverride All
        Require all granted
    </Directory>

    # Custom error pages — Airpay branded.
    ErrorDocument 404 /local/airpay_pages/error.php?code=404
    ErrorDocument 500 /local/airpay_pages/error.php?code=500
    ErrorDocument 503 /local/airpay_pages/error.php?code=503

    # Security headers.
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # Cache static assets.
    <FilesMatch "\.(css|js|png|jpg|gif|svg|woff2|ttf)$">
        Header set Cache-Control "public, max-age=604800"
    </FilesMatch>
</VirtualHost>

# ─── HTTP → HTTPS redirect ──────────────────────────────
<VirtualHost *:80>
    ServerName www.airpay.academy
    Redirect permanent / https://www.airpay.academy/
</VirtualHost>

# ─── OPTION B: Rewrite (if /moodle/ subdirectory) ───────
# Uncomment below INSTEAD of Option A if Moodle is in a subdirectory.
#
# <VirtualHost *:443>
#     ServerName www.airpay.academy
#     DocumentRoot /var/www/html
#
#     RewriteEngine On
#
#     # Redirect /moodle/... to /...
#     RewriteCond %{REQUEST_URI} ^/moodle/(.*)$
#     RewriteRule ^/moodle/(.*)$ /$1 [R=301,L]
#
#     # Proxy all requests to Moodle directory.
#     RewriteCond %{REQUEST_URI} !^/moodle/
#     RewriteRule ^/(.*)$ /moodle/$1 [PT,L]
# </VirtualHost>

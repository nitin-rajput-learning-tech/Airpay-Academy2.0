<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" preserveAspectRatio="xMidYMid slice">
  <!-- Default course banner — served by course_bannerimage() when a course
       has no overview image (UI-NAV-AUDIT residue: the fallback previously
       pointed at a pix asset that was never shipped, 404ing on every course
       without a banner). Brand gradient matches the login hero. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#003d66"/>
      <stop offset="0.45" stop-color="#0066A7"/>
      <stop offset="1" stop-color="#0d5da1"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.75" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="280" fill="url(#bg)"/>
  <rect width="1200" height="280" fill="url(#glow)"/>
  <!-- soft decorative circles, echoing the login hero -->
  <circle cx="1080" cy="240" r="190" fill="#ffffff" opacity="0.05"/>
  <circle cx="140" cy="-40" r="150" fill="#ffffff" opacity="0.04"/>
  <circle cx="920" cy="60" r="60" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
  <!-- circular 'a' monogram watermark (brand book p07 echo) -->
  <text x="1165" y="330" font-family="Montserrat, -apple-system, sans-serif" font-size="300"
        font-weight="800" fill="#ffffff" fill-opacity="0.06" text-anchor="end">a</text>
</svg>

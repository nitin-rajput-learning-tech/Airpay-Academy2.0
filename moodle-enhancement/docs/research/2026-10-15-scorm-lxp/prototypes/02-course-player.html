<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Course player - Sentientia prototype</title>
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/proto.css">
<style>
  .player { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: var(--ap-space-6); align-items: start; }
  .toc { position: sticky; top: calc(var(--ap-topbar-height) + var(--ap-space-4)); }
  .toc ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--ap-space-1); }
  .toc button { width: 100%; display: flex; align-items: center; gap: var(--ap-space-3); min-height: var(--ap-tap-target-cozy); padding: var(--ap-space-2) var(--ap-space-3); border: 1px solid transparent; border-radius: var(--ap-radius-sm); background: transparent; cursor: pointer; text-align: start; font-size: var(--ap-text-sm); }
  .toc button:hover { background: var(--ap-color-bg-hover); }
  .toc button[aria-current="true"] { background: var(--ap-color-bg-active); border-color: var(--ap-color-primary); font-weight: var(--ap-weight-semibold); }
  .toc .kind { width: 24px; height: 24px; border-radius: var(--ap-radius-xs); background: var(--ap-color-bg-inset); display: inline-flex; align-items: center; justify-content: center; font-size: var(--ap-text-xs); font-weight: var(--ap-weight-bold); flex: 0 0 auto; }
  .toc .t { flex: 1 1 auto; min-width: 0; }
  .stage-head { display: flex; gap: var(--ap-space-3); align-items: center; flex-wrap: wrap; }
  .slide h2 { font-size: var(--ap-text-3xl); font-weight: var(--ap-weight-extrabold); margin-block-end: var(--ap-space-4); }
  .slide ul { margin: 0 0 var(--ap-space-5); padding-inline-start: var(--ap-space-6); display: flex; flex-direction: column; gap: var(--ap-space-3); font-size: var(--ap-text-lg); }
  .audio { background: var(--ap-color-bg-surface-alt); border: 1px solid var(--ap-color-border); border-radius: var(--ap-radius-md); padding: var(--ap-space-4); display: flex; flex-direction: column; gap: var(--ap-space-3); }
  .scrub { width: 100%; accent-color: var(--ap-color-primary); height: 24px; }
  .karaoke { min-height: 5.5em; padding: var(--ap-space-4); border-radius: var(--ap-radius-sm); background: var(--ap-neutral-900); color: var(--ap-neutral-300); font-size: var(--ap-text-lg); line-height: 1.7; }
  :root[data-theme="dark"] .karaoke { background: var(--ap-neutral-950); }
  .karaoke .w.done { color: var(--ap-neutral-100); } .karaoke .w.now { background: var(--ap-color-primary); color: var(--ap-color-on-primary); border-radius: 4px; padding: 0 3px; }
  .karaoke[hidden] { display: none; }
  .choice { display: block; width: 100%; text-align: start; padding: var(--ap-space-4); border: 1px solid var(--ap-color-border-strong); border-radius: var(--ap-radius-sm); background: var(--ap-color-bg-surface); cursor: pointer; min-height: var(--ap-tap-target-min); }
  .choice:hover:not(:disabled) { border-color: var(--ap-color-primary); background: var(--ap-color-bg-hover); }
  .outcome { padding: var(--ap-space-4); border-radius: var(--ap-radius-sm); border-inline-start: 4px solid var(--c); background: var(--ap-color-bg-surface-alt); }
  .outcome.acceptable { --c: var(--ap-color-outcome-acceptable); background: var(--ap-color-success-light); } .outcome.recoverable { --c: var(--ap-color-outcome-recoverable); background: var(--ap-color-warning-light); } .outcome.irrecoverable { --c: var(--ap-color-outcome-irrecoverable); background: var(--ap-color-danger-light); }
  .q label { display: flex; gap: var(--ap-space-3); align-items: flex-start; padding: var(--ap-space-3); border-radius: var(--ap-radius-sm); cursor: pointer; min-height: var(--ap-tap-target-cozy); }
  .q label.right { background: var(--ap-color-success-light); } .q label.wrong { background: var(--ap-color-danger-light); }
  .token { word-break: break-all; }
  @media (max-width: 1100px) { .player { grid-template-columns: minmax(0, 1fr); } .toc { position: static; } }
  @media (max-width: 560px) { .slide h2 { font-size: var(--ap-text-2xl); } .slide ul { font-size: var(--ap-text-base); } }
</style>
</head>
<body>
<main>
  <div class="page">
    <div class="stage-head">
      <div class="grow">
        <p class="xs muted bold">SOP-CS-014 - 12 minutes - mandatory</p>
        <h2 id="course-title"></h2>
      </div>
      <div class="field" style="min-width:220px">
        <label for="lang">Course language</label>
        <select class="select" id="lang"></select>
      </div>
      <span class="chip ok" id="track"></span>
    </div>
    <div class="player">
      <nav class="card toc" aria-label="Course contents">
        <details open id="toc-details">
          <summary class="bold" style="cursor:pointer;min-height:var(--ap-tap-target-cozy);display:flex;align-items:center">Contents</summary>
          <ol id="toc"></ol>
        </details>
        <hr class="divider" style="margin-block:var(--ap-space-4)">
        <p class="label">Saved progress token</p>
        <p class="mono token small" id="token"></p>
        <p class="xs muted" id="token-note"></p>
      </nav>
      <section class="card" id="stage" aria-live="off" tabindex="-1"></section>
    </div>
  </div>
</main>
<script src="assets/proto.js"></script>
<script>
(function () {

      p1: ['Verify, classify, set expectations, record, escalate'],

      fallback: 'अंग्रेज़ी में दिखाया गया: अभी अनुवाद नहीं हुआ।'

      p2: ['رقم الجوال المسجّل مع سؤالَي أمان', 'لا تطلب أبدًا UPI PIN أو OTP أو رقم البطاقة أو CVV', 'اجمع UTR والتاريخ والمبلغ واسم التاجر', 'تحقق من الحالة: Success أو Pending أو Failed'],

  function t(key) { var l = T[lang] || {}; return l[key] !== undefined ? { v: l[key], fb: false } : { v: T.en[key], fb: lang !== 'en' }; }

  var blocks = [{ id: 'b01', k: 'S', key: 'b1', p: 'p1', n: 'n1' }, { id: 'b02', k: 'S', key: 'b2', p: 'p2', n: 'n2' }, { id: 'b03', k: 'S', key: 'b3', p: 'p3', n: 'n3' }, { id: 'b04', k: 'S', key: 'b4', p: 'p4', n: 'n4' }, { id: 's01', k: 'D', key: 's' }, { id: 'q01', k: 'Q', key: 'q' }, { id: 'sum', k: '=', key: 'sum' }];

  var SC = {
    n1: { p: '"Twelve thousand four hundred rupees gone and the shop says they got nothing. Fix it now or I am going to the bank and the police." What do you say first?', e: [
      { id: 'e1a', t: '"I understand, Rohan. A debit without delivery is stressful. I will check it right now. May I confirm your registered mobile number?"', to: 'n2', d: 10, o: 'acceptable', c: 'Acknowledgement first, then authentication through an allowed channel. The customer slows down.' },
      { id: 'e1b', t: '"Please share the OTP you just received so I can verify the transaction quickly."', to: 'f', d: -10, o: 'irrecoverable', c: 'Asking for an OTP is a disciplinary offence under SOP-CS-014. The call is flagged for review.' },

    return el('div', { class: 'audio' }, [el('div', { class: 'row' }, [btn, time, el('span', { class: 'grow' }), el('label', { class: 'xs muted', for: 'spd-x' }, ['Speed']), spd, cap]), scrub, kar, tr, el('p', { class: 'xs muted', text: 'Mock audio is silent in this prototype; the highlight timing is simulated at 130 words per minute.' })]);
  }

  function renderSlide(b) {

    ]));

  function renderScenario() {
    var node = SC[scen.node], isEnd = !!node.term;
    stage.appendChild(el('p', { class: 'chip info', text: 'Scenario - practice', style: 'align-self:flex-start;margin-bottom:8px' }));
    stage.appendChild(el('h2', { id: 'slide-h', tabindex: '-1', text: t('s').v, lang: t('s').fb ? 'en' : lang }));
    var area = el('div', { class: 'stack', style: 'margin-top:var(--ap-space-4)', 'aria-live': 'polite' });
    stage.appendChild(area);
    if (scen.pending) {
      var e = scen.pending;
      area.appendChild(el('div', { class: 'outcome ' + e.o }, [el('p', { class: 'bold row', style: 'gap:8px' }, [P.icon(e.o === 'acceptable' ? 'check' : 'alert'), { acceptable: 'Good choice', recoverable: 'You can recover', irrecoverable: 'Serious mistake' }[e.o]]), el('p', { text: e.c })]));
      area.appendChild(el('div', null, [el('button', { type: 'button', class: 'btn primary', onclick: function () { scen.pending = null; render(); } }, [t('cont').v, P.icon('right', 'i-flip')])]));
    } else if (isEnd) {
      var cls = node.term === 'success' ? 'acceptable' : node.term === 'partial' ? 'recoverable' : 'irrecoverable';
      area.appendChild(el('div', { class: 'outcome ' + cls }, [el('p', { class: 'bold', text: { success: 'Best outcome', partial: 'Partly handled', failure: 'Scenario failed' }[node.term] }), el('p', { text: node.p })]));
      area.appendChild(el('p', { class: 'bold', text: 'Scenario score: ' + Math.max(0, scen.score) + ' of 30 (pass mark 20)' }));
      area.appendChild(el('div', null, [el('button', { type: 'button', class: 'btn', onclick: function () { scen = { path: [], node: 'n1', pending: null, score: 0 }; render(); } }, [P.icon('refresh'), t('again').v])]));
    } else {
      area.appendChild(el('div', { class: 'row', style: 'gap:12px;align-items:flex-start;flex-wrap:nowrap' }, [el('span', { class: 'chip line', text: 'Rohan, angry caller' })]));
      area.appendChild(el('p', { class: 'prompt', style: 'font-size:var(--ap-text-lg)', text: node.p }));
      var list = el('div', { class: 'stack' });
      node.e.forEach(function (ed) { list.appendChild(el('button', { type: 'button', class: 'choice', text: ed.t, onclick: function () { scen.path.push(ed.id); scen.score += ed.d; scen.node = ed.to; scen.pending = ed; render(); } })); });
      area.appendChild(list);
    }
    if (scen.path.length) {
      stage.appendChild(el('div', { class: 'row', style: 'margin-top:var(--ap-space-4)' }, [el('span', { class: 'small muted', text: 'Decisions made: ' + scen.path.length }), el('span', { class: 'small muted', text: 'Score so far: ' + scen.score })]));
    }
  }

  function renderQuiz() {
    stage.appendChild(el('p', { class: 'chip info', text: 'Quiz - mastery check, pass mark 70%', style: 'align-self:flex-start;margin-bottom:8px' }));
    stage.appendChild(el('h2', { id: 'slide-h', tabindex: '-1', text: t('q').v, lang: t('q').fb ? 'en' : lang }));
    var form = el('div', { class: 'stack', style: 'margin-top:var(--ap-space-4)' });
    QZ.forEach(function (q) {
      var set = quiz.ans[q.id] || [];
      var fs = el('fieldset', { class: 'q', style: 'border:1px solid var(--ap-color-border);border-radius:var(--ap-radius-sm);padding:var(--ap-space-4)' }, [el('legend', { class: 'bold', style: 'padding:0 8px', text: q.s })]);
      q.o.forEach(function (o, i) {
        var input = el('input', { type: q.type === 'one' ? 'radio' : 'checkbox', name: q.id, value: i, checked: set.indexOf(i) >= 0, disabled: quiz.done, onchange: function () { var cur = quiz.ans[q.id] || []; if (q.type === 'one') { cur = [i]; } else if (input.checked) { cur.push(i); } else { cur = cur.filter(function (x) { return x !== i; }); } quiz.ans[q.id] = cur; paintToken(); } });
        var cls = '';
        if (quiz.done) { cls = o[1] ? 'right' : (set.indexOf(i) >= 0 ? 'wrong' : ''); }
        fs.appendChild(el('label', { class: cls }, [input, el('span', null, [o[0], quiz.done && o[2] && (set.indexOf(i) >= 0 || o[1]) ? el('span', { class: 'xs muted', style: 'display:block', text: o[2] }) : null])]));
      });
      form.appendChild(fs);
    });
    stage.appendChild(form);
    var res = el('div', { 'aria-live': 'polite', style: 'margin-top:var(--ap-space-4)' });
    stage.appendChild(res);
    if (quiz.done) {
      var correct = 0; QZ.forEach(function (q) { var set = quiz.ans[q.id] || []; var want = q.o.map(function (o, i) { return o[1] ? i : -1; }).filter(function (x) { return x >= 0; }); if (set.length === want.length && want.every(function (w) { return set.indexOf(w) >= 0; })) { correct++; } });
      var pct = Math.round(correct / QZ.length * 100);
      res.appendChild(el('div', { class: 'callout ' + (pct >= 70 ? 'ok' : 'bad'), role: 'status' }, [P.icon(pct >= 70 ? 'check' : 'alert'), 'You scored ' + pct + ' percent. ' + (pct >= 70 ? 'Passed.' : 'Not passed yet: pass mark is 70%.')]));
      res.appendChild(el('div', { style: 'margin-top:12px' }, [el('button', { type: 'button', class: 'btn', onclick: function () { quiz = { done: false, ans: {} }; render(); } }, [P.icon('refresh'), t('again').v])]));
    } else {
      res.appendChild(el('button', { type: 'button', class: 'btn primary', onclick: function () { quiz.done = true; render(); } }, [t('check').v]));
    }
  }

  function renderSummary() {
    stage.appendChild(el('h2', { id: 'slide-h', tabindex: '-1', text: t('sum').v }));
    var done = blocks.slice(0, 6).filter(function (b, i) { return visited[i]; }).length;
    stage.appendChild(el('div', { class: 'grid cols-3', style: 'margin-top:var(--ap-space-4)' }, [
      el('div', { class: 'kpi' }, [el('span', { class: 'v', text: done + '/6' }), el('span', { class: 'l', text: 'Steps visited' })]),
      el('div', { class: 'kpi' }, [el('span', { class: 'v', text: Math.max(0, scen.score) + '/30' }), el('span', { class: 'l', text: 'Scenario' })]),
      el('div', { class: 'kpi' }, [el('span', { class: 'v', text: quiz.done ? 'Done' : 'Open' }), el('span', { class: 'l', text: 'Quiz' })])
    ]));
    stage.appendChild(el('p', { class: 'muted', style: 'margin-top:var(--ap-space-4)', text: 'On finishing, the player writes the final status, score and a resume point to the LMS (exit = suspend), so closing the tab never loses progress.' }));
  }

  function paintToken() {
    var bits = 0; visited.forEach(function (v, i) { if (v) { bits |= 1 << i; } });
    var bm = btoa(String.fromCharCode(bits)).replace(/=+$/, '');
    var q = Object.keys(quiz.ans).map(function (k) { return k + ':' + quiz.ans[k].join('+'); }).join(',');
    var tok = 'v1|' + lang + '|' + idx + '|' + bm + '|s01:' + scen.path.join(',') + '|q01' + (quiz.done ? '!' : '') + '=' + q;
    document.getElementById('token').textContent = tok;
    document.getElementById('token-note').textContent = tok.length + ' characters. SCORM 1.2 allows 4,096; the player compresses above 3,500.';
    document.getElementById('track').replaceChildren(P.icon('check'), 'Progress is being saved (SCORM 1.2)');
  }

  function renderToc() {
    var ol = document.getElementById('toc'); ol.replaceChildren();
    blocks.forEach(function (b, i) {
      var st = i === 6 ? '' : (visited[i] ? (i < idx || i !== idx ? 'Done' : '') : '');
      ol.appendChild(el('li', null, [el('button', { type: 'button', 'aria-current': i === idx ? 'true' : null, onclick: function () { go(i); } }, [el('span', { class: 'kind', 'aria-hidden': 'true', text: b.k }), el('span', { class: 't', text: t(b.key).v, lang: t(b.key).fb ? 'en' : lang }), el('span', { class: 'xs muted', text: i === 6 ? '' : (visited[i] && i !== idx ? 'Done' : '') })])]));
    });
  }

  function nav() {
    var row = el('div', { class: 'row spread', style: 'margin-top:var(--ap-space-6)' }, [
      el('button', { type: 'button', class: 'btn', disabled: idx === 0, onclick: function () { go(idx - 1); } }, [P.icon('left', 'i-flip'), t('prev').v]),
      el('span', { class: 'small muted', text: 'Step ' + (idx + 1) + ' of ' + blocks.length }),
      el('button', { type: 'button', class: 'btn primary', disabled: idx === blocks.length - 1, onclick: function () { go(idx + 1); } }, [t('next').v, P.icon('right', 'i-flip')])
    ]);
    stage.appendChild(row);
  }

  function go(i) { stopPlay(); pos = 0; idx = Math.max(0, Math.min(blocks.length - 1, i)); visited[idx] = true; render(true); }

  function render(keepFocus) {
    var l = P.LANGS.filter(function (x) { return x.tag === lang; })[0];
    document.documentElement.setAttribute('lang', lang);
    document.getElementById('course-title').textContent = t('title').v;
    document.getElementById('course-title').setAttribute('lang', t('title').fb ? 'en' : lang);
    stage.replaceChildren(); audioEls = {};
    var b = blocks[idx];
    visited[idx] = true;
    if (b.k === 'S') { renderSlide(b); } else if (b.k === 'D') { renderScenario(); } else if (b.k === 'Q') { renderQuiz(); } else { renderSummary(); }
    nav(); renderToc(); paintToken(); paintAudio();
    var det = document.getElementById('toc-details'); if (!render.once) { render.once = true; det.open = window.matchMedia('(min-width: 1101px)').matches; }
    if (keepFocus === true) { var h = document.getElementById('slide-h'); if (h) { h.focus({ preventScroll: true }); } }
  }

  langOptions();
  if (lang === 'ar' || lang === 'ur') { P.applyDir('rtl'); }
  render();
}());
</script>
</body>
</html>

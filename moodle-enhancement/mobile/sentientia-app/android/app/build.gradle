// android/app/build.gradle — Sentientia LMS Android app module
//
// TEMPLATE FILE — generated by the Capacitor scaffold.
// Run `npx cap add android` to generate the full android/ directory.
// Apply these patterns to the generated build.gradle.
//
// SECRETS: All signing credentials are read from environment variables or
// a local keystore.properties file — NEVER hardcode credentials here.

apply plugin: 'com.android.application'

android {
    namespace 'academy.airpay.sentientia'
    compileSdk 34

    defaultConfig {
        applicationId "academy.airpay.sentientia"
        minSdk 24       // Android 7.0 — covers 97%+ of active Android devices (2026)
        targetSdk 34    // Android 14 — required for Play Store submission
        versionCode 1
        versionName "1.0.0"
    }

    // Signing config — reads from keystore.properties (local) or env vars (CI/CD).
    // Create android/keystore.properties with: storeFile, storePassword, keyAlias, keyPassword
    // See BUILD.md §Android: Keystore management
    signingConfigs {
        release {
            def keystorePropertiesFile = rootProject.file("keystore.properties")
            if (keystorePropertiesFile.exists()) {
                def keystoreProperties = new Properties()
                keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            } else {
                // CI/CD: read from GitHub Actions secrets set as env vars
                storeFile file(System.getenv("ANDROID_KEYSTORE_PATH") ?: "missing-keystore.jks")
                storePassword System.getenv("ANDROID_STORE_PASSWORD") ?: ""
                keyAlias System.getenv("ANDROID_KEY_ALIAS") ?: ""
                keyPassword System.getenv("ANDROID_KEY_PASSWORD") ?: ""
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // Capacitor core — version must match package.json @capacitor/android version
    implementation project(':capacitor-android')

    // Capacitor plugins
    implementation project(':capacitor-push-notifications')
    implementation project(':capacitor-app')
    implementation project(':capacitor-browser')
    implementation project(':capacitor-network')
    implementation project(':capacitor-status-bar')
    implementation project(':capacitor-splash-screen')

    // Firebase Messaging (FCM) — required for PushNotifications on Android
    // google-services.json must be at android/app/google-services.json
    // Obtain from Firebase Console → Project Settings → Your Apps → Android App
    // NEVER commit google-services.json (contains API keys)
    implementation 'com.google.firebase:firebase-messaging:23.4.0'
}

// FCM requires google-services plugin
// Add to root build.gradle: classpath 'com.google.gms:google-services:4.4.0'
apply plugin: 'com.google.gms.google-services'
